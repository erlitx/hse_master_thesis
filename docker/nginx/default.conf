server {
    listen 80;
    server_name mcp.dev.centaursoftware.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://mcp_server:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name mcp.dev.centaursoftware.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.dev.centaursoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.dev.centaursoftware.com/privkey.pem;

    location / {
        proxy_pass http://mcp_server:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

